<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>All Courses</h1>
    <ul>
        {% for course in courses%}
            <li>
                <a href="{% url 'courses:course-detail' course_slug=course.slug %}">{{course.title}}</a>
                - ${{course.price}}
            </li>
        {% empty %}
            <li>No courses found</li>
        {% endfor %}
    </ul>
</body>
</html>
